name: Architect merge

# The owner delegated PR approval to the architect routine. When it labels a
# claude/* PR `architect-approved`, merge it. Agents themselves never merge.
#
# Each run is a sweep: it merges every open approved claude/* PR, not only the
# one that triggered it. GitHub keeps a single pending run per concurrency
# group and cancels the others, so labeling several PRs at once used to drop
# approvals (#574). With a sweep, whichever run survives merges them all.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  merge:
    if: >-
      github.event_name == 'workflow_dispatch' || (
      github.event.label.name == 'architect-approved' &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Merge one PR at a time; concurrent merges fail with "Base branch was
    # modified". Job-level, so runs for other labels (skipped by the `if`)
    # never enter the group and cannot cancel a pending approval run.
    concurrency:
      group: architect-merge
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Merge all approved PRs
        run: |
          set -u
          prs=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq \
            '.[] | select(.head.repo.full_name == env.REPO)
                 | select(.head.ref | startswith("claude/"))
                 | select(.draft | not)
                 | select(any(.labels[]; .name == "architect-approved"))
                 | .number' | sort -n)
          echo "Approved PRs: ${prs:-none}"
          merged=0
          failed=""
          echo "merged=0" >> "$GITHUB_ENV"
          for pr in $prs; do
            ok=""
            for attempt in 1 2 3 4 5; do
              if out=$(gh api -X PUT "repos/$REPO/pulls/$pr/merge" -f merge_method=squash 2>&1); then
                ok=1; break
              fi
              echo "PR #$pr attempt $attempt: $out"
              # Only "Base branch was modified" (409) is worth retrying; a
              # conflict or red required check (405/422) will not fix itself.
              case "$out" in *"HTTP 409"*) ;; *) break ;; esac
              [ "$attempt" = 5 ] || sleep $((attempt * 20))
            done
            if [ -z "$ok" ]; then
              echo "::error::PR #$pr could not be merged"
              failed="$failed #$pr"
              continue
            fi
            merged=$((merged + 1))
            echo "merged=$merged" >> "$GITHUB_ENV"
            ref=$(gh api "repos/$REPO/pulls/$pr" --jq '.head.ref') || ref=""
            [ -z "$ref" ] || gh api -X DELETE "repos/$REPO/git/refs/heads/$ref" --silent || true

            # A merge made with GITHUB_TOKEN does not auto-close linked issues.
            body=$(gh api "repos/$REPO/pulls/$pr" --jq '.body // ""') || body=""
            for n in $(printf '%s' "$body" \
                | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#[0-9]+' \
                | grep -oE '[0-9]+' | sort -u); do
              gh api -X PATCH "repos/$REPO/issues/$n" \
                -f state=closed -f state_reason=completed --silent || true
              gh api -X DELETE "repos/$REPO/issues/$n/labels/in-review" --silent || true
            done
          done
          if [ -n "$failed" ]; then
            echo "Not merged:$failed"
            echo "failed=1" >> "$GITHUB_ENV"
          fi

      # A merge made with GITHUB_TOKEN does not trigger the push CI on main.
      - name: Run CI on main
        if: always() && env.merged != '' && env.merged != '0'
        run: gh api -X POST "repos/$REPO/actions/workflows/ci.yml/dispatches" -f ref=main

      - name: Fail if a PR was skipped
        if: always() && env.failed == '1'
        run: exit 1
