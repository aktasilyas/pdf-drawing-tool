name: Architect merge

# The owner delegated PR approval to the architect routine. When it labels a
# claude/* PR `architect-approved`, merge it. Agents themselves never merge.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  merge:
    if: >-
      github.event.label.name == 'architect-approved' &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pulls/$PR/merge" \
            -f merge_method=squash
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.event.pull_request.head.ref }}" || true

      # A merge made with GITHUB_TOKEN neither auto-closes linked issues nor
      # triggers the push CI on main, so do both explicitly.
      - name: Close linked issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          body=$(gh api "repos/$REPO/pulls/$PR" --jq '.body // ""')
          for n in $(printf '%s' "$body" \
              | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#[0-9]+' \
              | grep -oE '[0-9]+' | sort -u); do
            gh api -X PATCH "repos/$REPO/issues/$n" \
              -f state=closed -f state_reason=completed --silent || true
            gh api -X DELETE "repos/$REPO/issues/$n/labels/in-review" --silent || true
          done

      - name: Run CI on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh api -X POST "repos/$REPO/actions/workflows/ci.yml/dispatches" -f ref=main
