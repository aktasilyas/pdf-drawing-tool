name: Pages

# Publishes docs/store/privacy-policy.md at
# https://aktasilyas.github.io/pdf-drawing-tool/privacy/
# One-time owner step: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - docs/store/privacy-policy.md
      - scripts/build-privacy-page.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install markdown
      - name: Render privacy policy
        run: |
          mkdir -p _site/privacy
          python3 scripts/build-privacy-page.py docs/store/privacy-policy.md _site/privacy/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
