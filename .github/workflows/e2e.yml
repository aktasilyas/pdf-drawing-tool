name: E2E

# Integration tests (example_app/integration_test) on an Android emulator,
# all feature flags off (v1.0 scope). Failures are emitted as annotations
# because job logs are not readable from cloud agent sessions.
# The phone suite runs in two parallel shards to stay under 30 min; a
# Pixel Tablet runs a smoke subset (shards: scripts/e2e-run.sh).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    paths:
      - 'example_app/lib/**'
      - 'example_app/integration_test/**'
      - '.github/workflows/e2e.yml'
      - 'scripts/e2e-run.sh'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: android-emulator (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: phone-a
            profile: pixel_6
          - shard: phone-b
            profile: pixel_6
          - shard: tablet
            profile: pixel_tablet
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true

      - name: Dependencies
        run: ./scripts/check.sh pub

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: example_app
          # The runner executes each script line separately: keep it one line.
          script: ../scripts/e2e-run.sh ${{ matrix.shard }} "$RUNNER_TEMP/e2e"

      - name: Report result
        if: always()
        run: |
          log="$RUNNER_TEMP/e2e/test.log"
          if [ ! -f "$log" ]; then
            echo "::error title=e2e::Emulator step produced no test log (emulator failed to start?)."
            exit 1
          fi
          tail -n 15 "$log"
          grep -h 'E2E_EXPORT_MEMORY' "$log" | while read -r line; do echo "::notice title=export memory::$line"; done
          if [ -f "$RUNNER_TEMP/e2e/failed" ]; then
            msg=$( { grep -E '\[E\]|EXCEPTION CAUGHT|Some tests failed|Expected:|Actual:|Timed out' "$log" | head -n 30; echo '...'; tail -n 40 "$log"; } \
              | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=e2e integration tests (${{ matrix.shard }})::$msg"
            exit 1
          fi

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/e2e/
            example_app/screenshots/
          if-no-files-found: warn
