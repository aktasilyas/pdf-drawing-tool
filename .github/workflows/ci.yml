name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: [packages/drawing_core, packages/drawing_ui, example_app]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true

      - name: Dependencies
        run: ./scripts/check.sh pub

      - name: Format check
        run: dart format --output=none --set-exit-if-changed packages example_app/lib example_app/test

      - name: Analyze
        run: ./scripts/check.sh analyze ${{ matrix.package }}

      - name: Test
        run: ./scripts/check.sh test ${{ matrix.package }}
