name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Placeholder .env (declared as an asset in example_app)
        run: printf 'SUPABASE_URL=https://example.supabase.co\nSUPABASE_ANON_KEY=placeholder\n' > example_app/.env

      - name: Dependencies
        run: ./scripts/check.sh pub

      - name: Format check (report-only until the baseline is clean, M3)
        run: dart format --output=none --set-exit-if-changed packages example_app/lib example_app/test
        continue-on-error: true

      - name: Analyze
        run: ./scripts/check.sh analyze

      - name: Test
        run: ./scripts/check.sh test
