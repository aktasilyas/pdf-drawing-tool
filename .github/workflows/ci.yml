name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: [packages/drawing_core, packages/drawing_ui, example_app]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true

      - name: Dependencies
        run: ./scripts/check.sh pub

      - name: Format check
        run: dart format --output=none --set-exit-if-changed packages example_app/lib example_app/test

      - name: Analyze
        run: ./scripts/check.sh analyze ${{ matrix.package }}

      - name: Coverage tool
        if: matrix.package == 'packages/drawing_core'
        # Same version as the transitive `coverage` in drawing_core/pubspec.lock.
        run: dart pub global activate coverage 1.15.0

      - name: Test
        env:
          COVERAGE: '1'
        run: ./scripts/check.sh test ${{ matrix.package }}

      - name: Coverage
        # Summary in the job summary; fails below the floor in
        # scripts/coverage-thresholds.txt.
        run: ./scripts/coverage.sh ${{ matrix.package }}
