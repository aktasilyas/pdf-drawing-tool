name: Update goldens

# Regenerates golden PNGs, pubspec.lock files and gen-l10n output and runs
# dart format on a claude/* branch, for agent sessions that cannot download the
# Flutter engine. Dispatch:
#   gh api -X POST repos/<owner>/<repo>/actions/workflows/update-goldens.yml/dispatches \
#     -f ref=main -f "inputs[branch]=claude/<n>-<slug>" -f "inputs[package]=packages/drawing_ui"
# (use ref=<the branch> instead of main when the branch changes this workflow).
# The job commits changed goldens, lockfiles, example_app/lib/l10n and formatted
# Dart sources back to that branch (normal push; everything but goldens even if
# tests fail)
# and uploads every rendered PNG (including git-ignored platform goldens) as an
# artifact. A push made with GITHUB_TOKEN does not trigger CI, so the job
# dispatches ci.yml on the branch afterwards.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to update (must start with claude/)
        required: true
        type: string
      package:
        description: Package whose goldens to regenerate
        required: true
        type: choice
        options:
          - packages/drawing_ui
          - example_app

permissions:
  contents: write
  actions: write

concurrency:
  group: update-goldens-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  update:
    name: update-goldens (${{ inputs.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BRANCH: ${{ inputs.branch }}
      PACKAGE: ${{ inputs.package }}
    steps:
      - name: Validate inputs
        run: |
          if [[ ! "$BRANCH" =~ ^claude/[A-Za-z0-9._/-]+$ ]] || [[ "$BRANCH" == *..* ]]; then
            echo "::error::Refusing branch '$BRANCH': only claude/* branches may be updated."
            exit 1
          fi
          case "$PACKAGE" in
            packages/drawing_ui|example_app) ;;
            *) echo "::error::Unknown package '$PACKAGE'."; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ inputs.branch }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true

      - name: Dependencies
        id: deps
        run: ./scripts/check.sh pub

      - name: Format Dart sources
        # Same paths as the CI format check; agent sessions cannot run it.
        run: dart format packages example_app/lib example_app/test

      - name: Generate localizations
        if: hashFiles('example_app/l10n.yaml') != ''
        working-directory: example_app
        run: flutter gen-l10n

      - name: Regenerate goldens
        id: goldens
        working-directory: ${{ inputs.package }}
        # Failing test names go into an annotation: job logs are not readable
        # from cloud agent sessions, annotations are (check-runs API).
        run: |
          if ! flutter test --update-goldens > "$RUNNER_TEMP/test.log" 2>&1; then
            cat "$RUNNER_TEMP/test.log"
            msg=$( { grep -E '❌|\[E\]|EXCEPTION CAUGHT|Expected:|Actual:' "$RUNNER_TEMP/test.log" | head -n 30; echo '...'; tail -n 30 "$RUNNER_TEMP/test.log"; } \
              | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=update-goldens $PACKAGE::$msg"
            exit 1
          fi
          tail -n 3 "$RUNNER_TEMP/test.log"

      - name: Upload rendered PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldens-${{ github.run_id }}
          path: ${{ inputs.package }}/test/**/*.png
          if-no-files-found: warn

      - name: Commit changed goldens and generated files
        id: commit
        if: always() && steps.deps.outcome == 'success'
        env:
          GOLDENS: ${{ steps.goldens.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          # PNGs (.gitignore keeps platform goldens and failure diffs out),
          # lockfiles and gen-l10n output. Pathspec * also matches /.
          # Lockfiles via ls-files + xargs -r: no error when none matches.
          # PNGs only from a passing run.
          git ls-files -z --cached --others --exclude-standard -- '*pubspec.lock' \
            | xargs -0 -r git add --
          if [ -d example_app/lib/l10n ]; then git add -A -- example_app/lib/l10n; fi
          git add -u -- packages example_app/lib example_app/test
          if [ "$GOLDENS" = success ]; then git add -A -- "$PACKAGE/*.png"; fi
          if git diff --cached --quiet; then
            echo "Nothing changed."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat
          git commit -m 'chore(build): regenerate goldens, lockfiles, l10n, format [workflow]'
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Run CI on the branch
        if: always() && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh api -X POST "repos/$REPO/actions/workflows/ci.yml/dispatches" -f "ref=$BRANCH"
