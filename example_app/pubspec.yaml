name: example_app
description: Elyanotes drawing application demonstrating the drawing_toolkit library.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  shared_preferences: ^2.2.2
  drawing_ui:
    path: ../packages/drawing_ui
  drawing_core:
    path: ../packages/drawing_core
  go_router: ^13.0.0
  get_it: ^9.3.0
  injectable: ^3.0.0
  dartz: ^0.10.1
  equatable: ^2.0.5
  purchases_flutter: ^10.18.1
  connectivity_plus: ^5.0.2
  uuid: ^4.2.2
  supabase_flutter: ^2.3.0
  timeago: ^3.6.0
  intl: ^0.19.0
  google_sign_in: ^6.1.6
  drift: ^2.35.2
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  file_picker: ^8.0.0  # 6.1.1 değil, 8.0.0 kullan
  logger: ^2.0.2
  http: ^1.2.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1
  flutter_markdown: ^0.7.4
  flutter_math_fork: ^0.7.2
  firebase_core: ^4.15.2
  firebase_crashlytics: ^5.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.4.7
  injectable_generator: ^3.1.3
  freezed: ^4.0.3
  json_serializable: ^6.7.1
  mocktail: ^1.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/elyanotes_app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F4F1EA"
  adaptive_icon_foreground: "assets/images/elyanotes_icon_foreground.png"
  adaptive_icon_monochrome: "assets/images/elyanotes_icon_monochrome.png"

flutter_native_splash:
  color: "#F4F1EA"
  image: "assets/images/elyanotes_splash.png"
  color_dark: "#1B1A18"
  android_12:
    color: "#F4F1EA"
    image: "assets/images/elyanotes_splash.png"
    color_dark: "#1B1A18"
  ios: false
  web: false
  android: true

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/stickers/
    - assets/covers/
    - assets/images/
    - assets/legal/

  fonts:
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.otf
          weight: 400
        - asset: assets/fonts/SourceSerif4-Semibold.otf
          weight: 600
        - asset: assets/fonts/SourceSerif4-Bold.otf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: ComicRelief
      fonts:
        - asset: assets/fonts/ComicRelief-Bold.ttf
          weight: 700
